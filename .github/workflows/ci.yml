name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install gateway dependencies
        run: |
          cd gateway
          pip install -e ".[dev]"

      - name: Run ruff
        run: |
          cd gateway
          ruff check app/

      - name: Run mypy
        run: |
          cd gateway
          mypy app/

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dashboard dependencies
        run: |
          cd dashboard
          npm ci

      - name: Run ESLint
        run: |
          cd dashboard
          npm run lint

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: agentwall
          POSTGRES_PASSWORD: agentwall
          POSTGRES_DB: agentwall
        ports: 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentwall -d agentwall"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install gateway dependencies
        run: |
          cd gateway
          pip install -e ".[dev]"

      - name: Wait for services
        run: |
          sleep 5

      - name: Run gateway tests
        run: |
          cd gateway
          DATABASE_URL=postgresql+asyncpg://agentwall:agentwall@localhost:5432/agentwall \
          REDIS_URL=redis://localhost:6379/0 \
          pytest -v --cov=app --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./gateway/coverage.xml
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Gateway
        id: meta-gateway
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-gateway
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./gateway
          push: true
          tags: ${{ steps.meta-gateway.outputs.tags }}
          labels: ${{ steps.meta-gateway.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Extract metadata for Filesystem
        id: meta-fs
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-filesystem
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Filesystem
        uses: docker/build-push-action@v5
        with:
          context: ./tool_servers/filesystem
          push: true
          tags: ${{ steps.meta-fs.outputs.tags }}
          labels: ${{ steps.meta-fs.outputs.labels }}

      - name: Extract metadata for Database
        id: meta-db
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-database
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Database
        uses: docker/build-push-action@v5
        with:
          context: ./tool_servers/database
          push: true
          tags: ${{ steps.meta-db.outputs.tags }}
          labels: ${{ steps.meta-db.outputs.labels }}

      - name: Extract metadata for Web Fetch
        id: meta-wf
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-web-fetch
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Web Fetch
        uses: docker/build-push-action@v5
        with:
          context: ./tool_servers/web_fetch
          push: true
          tags: ${{ steps.meta-wf.outputs.tags }}
          labels: ${{ steps.meta-wf.outputs.labels }}

      - name: Extract metadata for Dashboard
        id: meta-dash
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-dashboard
          tags: |
            type=ref,event=branch
            type=sha

      - name: Build and push Dashboard
        uses: docker/build-push-action@v5
        with:
          context: ./dashboard
          push: true
          tags: ${{ steps.meta-dash.outputs.tags }}
          labels: ${{ steps.meta-dash.outputs.labels }}

  evaluation-smoke:
    name: Evaluation Smoke Test
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install gateway dependencies
        run: |
          cd gateway
          pip install -e ".[dev]"

      - name: Start services
        run: |
          docker compose up -d postgres redis filesystem database web_fetch
          sleep 10

      - name: Run gateway
        run: |
          cd gateway
          DATABASE_URL=postgresql+asyncpg://agentwall:agentwall@localhost:5432/agentwall \
          REDIS_URL=redis://localhost:6379/0 \
          timeout 30 uvicorn app.main:app --host 0.0.0.0 --port 8000 &
          sleep 5

      - name: Run smoke evaluation
        run: |
          cd gateway
          python -m evaluation.run_smoke_test || true

      - name: Cleanup
        run: |
          docker compose down -v